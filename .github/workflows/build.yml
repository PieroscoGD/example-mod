name: Build Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          target: Android64
      - name: Save the mod file
        uses: actions/upload-artifact@v4
        with:
          name: mod-android64
          path: "**/*.geode"
